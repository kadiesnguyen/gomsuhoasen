server {
    listen 80;
    server_name demo.gomhoasen.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
    }

    root /var/www/gomhoasen-poc-v2/current/dist;
    index index.html;

    location /assets/ {
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
