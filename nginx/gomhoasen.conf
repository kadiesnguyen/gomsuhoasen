# Gốm Hoa Sen — Gói A production topology
#
# /        -> showroom_v2 Vite static files
# /admin   -> portal Vite static files
# /api     -> NestJS API on 127.0.0.1:4000
# /uploads -> persistent files outside release tree

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    server_name gomhoasen.vn www.gomhoasen.vn;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        alias /var/www/gomhoasen/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4000/api/site/v2-sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/assets/ {
        alias /var/www/gomhoasen/current/dist/apps/portal/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ^~ /admin/ {
        alias /var/www/gomhoasen/current/dist/apps/portal/;
        try_files $uri $uri/ /admin/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }



    location / {
        root /var/www/gomhoasen/current/dist/apps/showroom_v2;
        
        # history API fallback
        try_files $uri $uri/ /index.html;
        
        # default: no cache for HTML
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|png|jpe?g|gif|ico|webp)$ {
        root /var/www/gomhoasen/current/dist/apps/showroom_v2;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gomhoasen.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gomhoasen.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.gomhoasen.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = gomhoasen.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name gomhoasen.vn www.gomhoasen.vn;
    listen 80;
    return 404; # managed by Certbot
}
