# gomsuhoasen — push main → build GHCR → Dokploy redeploy
# Images: ghcr.io/kadiesnguyen/gomsuhoasen/{api,web}
# Flow: build-api + build-web → Dokploy compose.redeploy → SSH force-pull api/web

name: Docker GHCR

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (api)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/api
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=tag

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (web)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/web
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=tag

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy Dokploy
    needs: [build-api, build-web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy compose.redeploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_URL:-}" ] || [ -z "${DOKPLOY_API_KEY:-}" ] || [ -z "${DOKPLOY_COMPOSE_ID:-}" ]; then
            echo "::error::Missing secrets DOKPLOY_URL / DOKPLOY_API_KEY / DOKPLOY_COMPOSE_ID"
            exit 1
          fi
          python3 <<'PY'
          import json, os, sys, urllib.error, urllib.request

          base = os.environ["DOKPLOY_URL"].rstrip("/")
          compose_id = os.environ["DOKPLOY_COMPOSE_ID"]
          headers = {
              "x-api-key": os.environ["DOKPLOY_API_KEY"],
              "Content-Type": "application/json",
          }
          body = json.dumps({"composeId": compose_id}).encode()

          def post(path: str) -> dict:
              req = urllib.request.Request(
                  f"{base}{path}",
                  data=body,
                  headers=headers,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=90) as resp:
                      raw = resp.read().decode()
                      code = resp.status
              except urllib.error.HTTPError as e:
                  raw = e.read().decode() if e.fp else str(e)
                  print(f"HTTP {e.code} {path}\n{raw}", file=sys.stderr)
                  sys.exit(1)
              print(f"HTTP {code} {path}\n{raw}")
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError:
                  print("::error::Dokploy response is not JSON", file=sys.stderr)
                  sys.exit(1)
              if not data.get("success"):
                  print("::error::Dokploy call not successful", file=sys.stderr)
                  sys.exit(1)
              return data

          # redeploy tells Dokploy to pull; SSH step below ensures api/web actually refresh
          post("/api/compose.redeploy")
          print("Dokploy redeploy queued OK")
          PY

      - name: Force pull api/web on VPS (no mongo recreate)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          COMPOSE_DIR: ${{ secrets.DEPLOY_COMPOSE_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_PASSWORD:-}" ]; then
            echo "::error::Missing secrets DEPLOY_HOST / DEPLOY_PASSWORD (SSH force-pull)"
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          USER_NAME="${DEPLOY_USER:-root}"
          DIR="${COMPOSE_DIR:-/etc/dokploy/compose/compose-parse-1080p-firewall-16f54l/code}"
          # Let Dokploy finish its recreate first to avoid container-name races.
          sleep 45
          export SSHPASS="$DEPLOY_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            "${USER_NAME}@${DEPLOY_HOST}" bash -s -- "$DIR" <<'EOS'
          set -euo pipefail
          DIR="$1"
          cd "$DIR"
          docker compose pull api web
          ok=0
          for i in 1 2 3 4 5 6; do
            if docker compose up -d --no-deps --force-recreate api web; then
              ok=1
              break
            fi
            echo "compose up conflict/busy, retry $i/6 in 20s..."
            sleep 20
          done
          if [ "$ok" != 1 ]; then
            echo "force-recreate failed after retries" >&2
            exit 1
          fi
          docker compose ps
          EOS
          echo "VPS api/web force-recreate OK"
